<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 400px;
    overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 400px;
    background: #0d1117;
    overflow: hidden;
  }

  /* ── Hintergrund: große Schriftzeichen ── */
  .bg-chars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }

  .bg-char {
    position: absolute;
    font-weight: 700;
    color: rgba(255,255,255,0.03);
    line-height: 1;
    letter-spacing: -0.05em;
  }

  /* ── Rote Akzentlinie links ── */
  .accent-bar {
    position: absolute;
    left: 80px;
    top: 60px;
    bottom: 60px;
    width: 3px;
    background: linear-gradient(180deg, transparent 0%, #C9213A 20%, #C9213A 80%, transparent 100%);
    border-radius: 2px;
  }

  /* ── Haupt-Inhalt ── */
  .content {
    position: absolute;
    left: 108px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
  }

  .label-top {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C9213A;
    margin-bottom: 14px;
  }

  .title {
    font-size: 48px;
    font-weight: 700;
    color: #f0f6fc;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .title span {
    color: #C9213A;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(240,246,252,0.45);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(201,33,58,0.6);
    flex-shrink: 0;
  }

  /* ── Flashcards rechts ── */
  .cards-area {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 340px;
    height: 240px;
  }

  .card {
    position: absolute;
    width: 220px;
    height: 140px;
    border-radius: 12px;
    border: 1px solid;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* Hintere Karte */
  .card-back {
    right: 20px;
    top: 60px;
    background: rgba(30,35,44,0.5);
    border-color: rgba(255,255,255,0.06);
    transform: rotate(6deg);
  }

  /* Mittlere Karte */
  .card-mid {
    right: 50px;
    top: 40px;
    background: rgba(30,35,44,0.7);
    border-color: rgba(255,255,255,0.08);
    transform: rotate(2deg);
  }

  /* Vordere Karte (aktiv) */
  .card-front {
    right: 80px;
    top: 20px;
    background: rgba(22,27,34,0.95);
    border-color: rgba(201,33,58,0.35);
    box-shadow:
      0 0 0 1px rgba(201,33,58,0.1),
      0 20px 40px rgba(0,0,0,0.5),
      0 0 60px rgba(201,33,58,0.06);
    transform: rotate(-2deg);
  }

  .card-chinese {
    font-size: 38px;
    font-weight: 700;
    color: #f0f6fc;
    line-height: 1;
  }

  .card-pinyin {
    font-size: 12px;
    color: #C9213A;
    letter-spacing: 0.05em;
  }

  .card-german {
    font-size: 11px;
    color: rgba(240,246,252,0.4);
    letter-spacing: 0.03em;
  }

  /* Fortschrittsbalken auf der Karte */
  .card-progress {
    position: absolute;
    bottom: 12px;
    left: 16px;
    right: 16px;
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 1px;
  }

  .card-progress-fill {
    height: 100%;
    width: 65%;
    background: linear-gradient(90deg, #C9213A, #e05065);
    border-radius: 1px;
  }

  /* Badge oben rechts auf der Karte */
  .card-badge {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(201,33,58,0.7);
    font-weight: 600;
  }

  /* ── Floating Pinyin-Labels ── */
  .pinyin-float {
    position: absolute;
    font-size: 11px;
    color: rgba(240,246,252,0.15);
    letter-spacing: 0.08em;
    font-weight: 400;
  }

  /* ── Statistik-Zeile unten links ── */
  .stats {
    position: absolute;
    bottom: 46px;
    left: 108px;
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-num {
    font-size: 18px;
    font-weight: 700;
    color: #f0f6fc;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: rgba(240,246,252,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stat-divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.08);
  }

  /* ── Subtiler Verlauf rechts ── */
  .vignette-right {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 520px;
    background: radial-gradient(ellipse at 90% 50%, rgba(201,33,58,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Horizontale Trennlinie ── */
  .divider-h {
    position: absolute;
    bottom: 72px;
    left: 108px;
    width: 280px;
    height: 1px;
    background: rgba(255,255,255,0.07);
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Hintergrund-Schriftzeichen -->
  <div class="bg-chars">
    <div class="bg-char" style="font-size:320px; right:-20px; top:-80px; color:rgba(255,255,255,0.025)">汉</div>
    <div class="bg-char" style="font-size:180px; right:300px; bottom:-60px; color:rgba(255,255,255,0.018)">语</div>
    <div class="bg-char" style="font-size:110px; left:20px; top:-20px; color:rgba(255,255,255,0.02)">学</div>
    <div class="bg-char" style="font-size:80px; left:40px; bottom:-10px; color:rgba(255,255,255,0.015)">习</div>
    <div class="bg-char" style="font-size:60px; left:530px; top:20px; color:rgba(255,255,255,0.012)">你好</div>
  </div>

  <!-- Floating Pinyin -->
  <div class="pinyin-float" style="left:540px; bottom:55px">xuéxí · zhōngwén · píngyīn</div>
  <div class="pinyin-float" style="left:540px; top:48px; font-size:10px">nǐ hǎo · zàijiàn · xièxie</div>

  <!-- Roter Akzent -->
  <div class="accent-bar"></div>

  <!-- Inhalt -->
  <div class="content">
    <div class="label-top">SIP Chinesisch 1 · Universität</div>
    <div class="title">Chinesisch-<br><span>Lernkartei</span></div>
    <div class="subtitle">
      <span>Mandarin</span>
      <div class="dot"></div>
      <span>Spaced Repetition</span>
      <div class="dot"></div>
      <span>Open Source</span>
    </div>
  </div>

  <!-- Trennlinie -->
  <div class="divider-h"></div>

  <!-- Statistik -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num">116</div>
      <div class="stat-label">Vokabeln</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num">SM-2</div>
      <div class="stat-label">Algorithmus</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-num">0</div>
      <div class="stat-label">API-Keys</div>
    </div>
  </div>

  <!-- Verlauf -->
  <div class="vignette-right"></div>

  <!-- Flashcards -->
  <div class="cards-area">
    <!-- Hintere Karte -->
    <div class="card card-back">
      <div class="card-chinese" style="opacity:0.3">再见</div>
    </div>
    <!-- Mittlere Karte -->
    <div class="card card-mid">
      <div class="card-chinese" style="opacity:0.5">谢谢</div>
    </div>
    <!-- Vordere Karte (aktiv) -->
    <div class="card card-front">
      <div class="card-badge">Review</div>
      <div class="card-chinese">你好</div>
      <div class="card-pinyin">nǐ hǎo</div>
      <div class="card-german">Hallo</div>
      <div class="card-progress">
        <div class="card-progress-fill"></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
